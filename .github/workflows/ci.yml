name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
        include:
          - os: ubuntu-22.04  # oldest supported: Raspberry Pi OS bookworm ships Python 3.11
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pyflakes scorereader.py sportzcast_mqtt.py scoreboards
      - run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: ScoreReader-windows-x64
          - os: macos-14            # Apple silicon
            name: ScoreReader-macos-arm64
          - os: ubuntu-22.04        # glibc 2.35: runs on Ubuntu 22.04+ and Debian 12+
            name: ScoreReader-linux-x64
          - os: ubuntu-22.04-arm    # Raspberry Pi 4/5 with 64-bit Raspberry Pi OS
            name: ScoreReader-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Build
        shell: bash
        run: |
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          python -m PyInstaller --noconfirm --onefile --name ScoreReader \
            --hidden-import sportzcast_mqtt --collect-submodules scoreboards \
            --add-data "daktronics_fields.json${SEP}." --add-data "scoreboards/catalog.json${SEP}scoreboards" \
            scorereader.py
      - name: Smoke test
        shell: bash
        run: |
          EXE=dist/ScoreReader; [ "$RUNNER_OS" = "Windows" ] && EXE=dist/ScoreReader.exe
          "$EXE" --version
      - name: Package
        shell: bash
        run: |
          mkdir -p pkg
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/ScoreReader.exe "pkg/${{ matrix.name }}.exe"
          else
            cp linux/99-scorebot.rules linux/scorebot-blacklist.conf dist/ 2>/dev/null || true
            tar -C dist -czf "pkg/${{ matrix.name }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: pkg/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pkg
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: pkg/*
          generate_release_notes: true
